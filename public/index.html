<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevMeet — Realtime Chat</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2330;
        --border: #2b333d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4493f8;
        --accent-2: #3fb950;
        --danger: #f85149;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 700px at 50% -20%, #1b2a44 0%, var(--bg) 55%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        width: min(720px, 100%);
        height: min(760px, 92vh);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, var(--panel-2), var(--panel));
      }

      .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), #7c5cff);
        color: #fff;
        flex: 0 0 auto;
      }

      .title {
        line-height: 1.2;
      }

      .title h1 {
        font-size: 1rem;
        margin: 0;
        font-weight: 650;
      }

      .subtitle {
        font-size: 0.72rem;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 0.75rem;
        color: var(--muted);
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.2);
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.5);
      }

      .status.on .dot {
        background: var(--accent-2);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(63, 185, 80, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0);
        }
      }

      /* Messages */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      .messages::-webkit-scrollbar {
        width: 10px;
      }
      .messages::-webkit-scrollbar-thumb {
        background: #2b333d;
        border-radius: 999px;
        border: 3px solid var(--panel);
      }

      .row {
        display: flex;
        flex-direction: column;
        max-width: 78%;
        animation: rise 0.18s ease-out;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .row.mine {
        align-self: flex-end;
        align-items: flex-end;
      }

      .row.theirs {
        align-self: flex-start;
        align-items: flex-start;
      }

      .who {
        font-size: 0.7rem;
        color: var(--muted);
        margin: 0 6px 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .bubble {
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 0.9rem;
        line-height: 1.45;
        word-break: break-word;
        border: 1px solid var(--border);
        background: var(--panel-2);
        border-bottom-left-radius: 6px;
      }

      .row.mine .bubble {
        background: linear-gradient(135deg, #2f6fdb, var(--accent));
        border-color: transparent;
        color: #fff;
        border-bottom-left-radius: 16px;
        border-bottom-right-radius: 6px;
      }

      .time {
        font-size: 0.65rem;
        color: var(--muted);
        margin: 4px 6px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .system {
        align-self: center;
        font-size: 0.72rem;
        color: var(--muted);
        background: rgba(139, 148, 158, 0.1);
        border: 1px dashed var(--border);
        padding: 5px 12px;
        border-radius: 999px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Composer */
      .composer {
        border-top: 1px solid var(--border);
        padding: 14px;
        display: flex;
        gap: 8px;
        background: var(--panel);
      }

      .composer input {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .composer input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(68, 147, 248, 0.18);
      }

      .composer .name {
        width: 120px;
        flex: 0 0 auto;
      }

      .composer .text {
        flex: 1;
        min-width: 0;
      }

      .composer button {
        flex: 0 0 auto;
        font: inherit;
        font-weight: 600;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 0 20px;
        background: var(--accent);
        cursor: pointer;
        transition: transform 0.1s, background 0.15s, opacity 0.15s;
      }

      .composer button:hover:not(:disabled) {
        background: #5aa2ff;
      }
      .composer button:active:not(:disabled) {
        transform: translateY(1px);
      }
      .composer button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      @media (max-width: 560px) {
        .composer .name {
          display: none;
        }
        .row {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="logo">D</div>
        <div class="title">
          <h1>DevMeet</h1>
          <span class="subtitle">socket.io + express</span>
        </div>
        <div class="status" id="status">
          <span class="dot"></span>
          <span id="statusText">connecting…</span>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="form">
        <input
          class="name"
          name="name"
          placeholder="name"
          autocomplete="off"
          maxlength="32"
        />
        <input
          class="text"
          name="text"
          placeholder="Type a message…"
          autocomplete="off"
          maxlength="500"
          required
        />
        <button type="submit" id="send" disabled>Send</button>
      </form>
    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const messages = document.getElementById("messages");
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const form = document.getElementById("form");
      const sendBtn = document.getElementById("send");

      // Same origin, default "/socket.io" path. On Vercel a rewrite maps it to
      // the api/socket Function. Websocket transport is required on Vercel.
      const socket = io({ transports: ["websocket"] });

      const escapeHtml = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );

      const time = (ts) =>
        new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      function addSystem(text) {
        const el = document.createElement("div");
        el.className = "system";
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
      }

      function addMessage(m) {
        const mine = m.id === socket.id;
        const row = document.createElement("div");
        row.className = "row " + (mine ? "mine" : "theirs");
        row.innerHTML = `
          ${mine ? "" : `<span class="who">${escapeHtml(m.name)}</span>`}
          <div class="bubble">${escapeHtml(m.text)}</div>
          <span class="time">${time(m.at)}</span>`;
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
      }

      socket.on("connect", () => {
        status.classList.add("on");
        statusText.textContent = "online";
        sendBtn.disabled = false;
      });

      socket.on("disconnect", (reason) => {
        status.classList.remove("on");
        statusText.textContent = "reconnecting…";
        sendBtn.disabled = true;
        addSystem(`disconnected: ${reason}`);
      });

      socket.io.on("reconnect", () => addSystem("reconnected"));
      socket.on("connect_error", (e) => addSystem(`connect error: ${e.message}`));

      socket.on("system", (d) => addSystem(d.message));
      socket.on("chat:message", addMessage);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const text = String(data.get("text") || "").trim();
        if (!text) return;
        socket.emit("chat:message", { name: data.get("name") || "anon", text });
        form.elements.text.value = "";
        form.elements.text.focus();
      });
    </script>
  </body>
</html>
